name: Run Dining Philosophers Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'



      - name: Build simulation binary
        run: go build -o dining main.go

      - name: Run Simulation
        run: |
          if [ -f ./dining ]; then
            ./dining > simulation.log 2>&1 & 
            sleep 15
            pkill dining || true
          else
            echo "Error: dining binary not found"
            exit 1
          fi

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: simulation-logs
          path: simulation.log
