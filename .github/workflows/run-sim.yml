name: Run Dining Simulation
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'   # optional scheduled daily run

jobs:
  run-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Build C binary
        run: |
          if [ -f c/phil.c ]; then gcc -pthread c/phil.c -o phil; fi
      - name: Run simulation
        run: |
          mkdir -p logs
          for i in $(seq 1 1000); do
            ./phil 6 $i >> logs/run_${i}.json 2>&1 || true
          done
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: simulation-logs
          path: logs/
