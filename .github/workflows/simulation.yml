name: Run Dining Philosophers Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Find dining.go
        id: findfile
        run: |
          file=$(find . -name "dining.go" | head -n 1)
          echo "DINING_FILE=$file" >> $GITHUB_ENV
          echo "Found dining.go at: $file"

      - name: Build Simulation
        run: go build -o dining $DINING_FILE

      - name: Run Simulation
        run: ./dining > simulation.log 2>&1 || true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: simulation-logs
          path: simulation.log
